<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="login.css">
    <script type="text/javascript" src="validation.js" defer></script>
</head>
<body>
 <div class="wrapper">
<h1>Reset Password</h1>
<p class="subtitle">Enter the email or phone number you signed up with to reset your password.</p>
<p id="error-message"></p>
<p id="success-message"></p>
<form id="form">
    <div>
        <input required type="text" name="contact" id="contact-input" placeholder="Email or Phone Number">
    </div>
    <button type="submit">Send Reset Link</button>
</form>
<p>Remembered it? <a href="login.html">Back to Login</a></p>
 </div>
</body>
</html>
