
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Medication Reminder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fa;
            color: #243447;
            margin: 0;
            padding: 30px;
        }

        header {
            text-align: center;
            background-color: #dceeff;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            font-size: 32px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
        }

        .reminder {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }

        button {
            font-size: 18px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #176b50;
            color: white;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid #243447;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <header>
        <h1>My Medication Reminder</h1>
        <p>Helping you stay on track with your medications.</p>
    </header>

    <main>
        <section class="reminder">
            <h2>Welcome!</h2>
            <p>Your medication schedule will appear here.</p>

            <h2>Today's Reminders</h2>
            <p>You have no reminders to display yet.</p>

            <button type="button" onclick="alert('Medication reminders are coming soon!')">
                View My Medications
            </button>
        </section>
    </main>
</body>
</html>
