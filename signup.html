<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="login.css">
    <script type="text/javascript" src="validation.js" defer></script>
</head>
<body>
 <div class="wrapper">
<h1>Sign Up</h1>
<p id="error-message"></p>
<form id="form">
    <div class="name-row">
        <input required type="text" name="firstname" id="firstname-input" placeholder="First Name" autocomplete="given-name">
        <input required type="text" name="lastname" id="lastname-input" placeholder="Last Name" autocomplete="family-name">
    </div>
    <div>
        <input required type="tel" name="phone" id="phone-input" placeholder="Phone Number" autocomplete="tel">
    </div>
    <div>
        <input required type="email" name="email" id="email-input" placeholder="Email" autocomplete="email">
    </div>
    <div>
        <input required type="password" name="password" id="password-input" placeholder="Password" autocomplete="new-password">
    </div>
    <div>
        <input required type="password" name="confirm_password" id="confirm-password-input" placeholder="Confirm Password" autocomplete="new-password">
    </div>

    <div class="checkbox-row">
        <input type="checkbox" name="has_guardian" id="guardian-checkbox">
        <label for="guardian-checkbox">I have a guardian</label>
    </div>

    <div class="guardian-fields hidden" id="guardian-fields">
        <h2>Guardian Information</h2>
        <div>
            <input type="text" name="guardian_name" id="guardian-name-input" placeholder="Guardian Full Name">
        </div>
        <div>
            <input type="tel" name="guardian_phone" id="guardian-phone-input" placeholder="Guardian Phone Number">
        </div>
        <div>
            <input type="email" name="guardian_email" id="guardian-email-input" placeholder="Guardian Email">
        </div>
    </div>

    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
 </div>
</body>
</html>
