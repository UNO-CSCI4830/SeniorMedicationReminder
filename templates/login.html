<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css')}}">
    <title>Register</title>
</head>
<body>
    <div class="login">
        <h2 class ="login">Login</h2>
        <form class="user-panel" action="{{ url_for('main.login')}}">
        
            <input class="textbox" type="text" name="username" placeholder="Enter Username" required>
            <input class="textbox" type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <p class="under-form">Don't have an account? <a href="{{ url_for('main.register')}}">Register Here</a></p>
    </div>
</body>

</html>
