<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css')}}">
    <script type="text/javascript" src="{{ url_for('static', filename='js/validation.js')}}" defer></script>
</head>
<body>
 <div class="wrapper">
<h1>Login</h1>
<p id="error-message"></p>
<form id="form">
    <div>
        <input required type="email" name="email" id="email-input" placeholder="Email">
    </div>
    <div>
        <input required type="password" name="password" id="password-input" placeholder="Password">
    </div>
    <button type="submit">Login</button>
</form>
<p>New here? <a href="{{ url_for('main.signup')}}">Create an Account</a></p>
 </div>
</body>
</html>
